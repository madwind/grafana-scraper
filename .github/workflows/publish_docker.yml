name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - 'version.ts'

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: madwind/grafana-scraper

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract app version from version.ts
        id: extract_version
        run: |
          APP_VERSION=$(sed -nE 's/^export const VERSION = "([^"]+)";$/\1/p' version.ts)
          if [ -z "$APP_VERSION" ]; then
            echo 'Unable to read VERSION from version.ts' >&2
            exit 1
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.extract_version.outputs.app_version }}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
